name: Publish to Hashnode

on:
  push:
    branches: [main]
    paths:
      - 'blogs/**.md'

jobs:
  publish:
    runs-on: ubuntu-latest

    # Skip bot commits (e.g. the SVG render action)
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish changed articles to Hashnode
        env:
          HASHNODE_API_KEY: ${{ secrets.HASHNODE_TOKEN }}
          HASHNODE_PUBLICATION_ID: "6a0e5ae48b03460221ceb78f"
        run: node .github/scripts/publish-to-hashnode.js
