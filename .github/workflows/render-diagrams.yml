name: Render Mermaid Diagrams to SVG

on:
  push:
    branches: [main]
    paths:
      - 'blogs/diagrams/**.mmd'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Render all MMD files to SVG
        run: |
          find blogs/diagrams -name "*.mmd" | while read f; do
            out="${f%.mmd}.svg"
            echo "Rendering $f → $out"
            mmdc \
              --input "$f" \
              --output "$out" \
              --theme neutral \
              --backgroundColor transparent \
              --width 1200 \
              --quiet
          done

      - name: Commit rendered SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blogs/diagrams/*.svg
          if git diff --staged --quiet; then
            echo "No SVG changes to commit."
          else
            git commit -m "chore: render Mermaid diagrams to SVG"
            git push
          fi
